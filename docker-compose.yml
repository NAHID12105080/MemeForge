services:
  postgres:
    image: postgres:16-alpine
    container_name: memeforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memeforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memeforge}
      POSTGRES_DB: ${POSTGRES_DB:-memeforge}
    ports:
      - "5432:5432"
    volumes:
      - memeforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memeforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  memeforge_pgdata:
